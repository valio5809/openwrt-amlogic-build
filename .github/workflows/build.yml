name: Build OpenWrt for Amlogic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize environment & dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget swig libelf-dev

    - name: Clone Ophub Amlogic OpenWrt Builder
      run: |
        git clone https://github.com/ophub/amlogic-s9xxx-openwrt.git openwrt_builder

    - name: Build and Pack Image
      run: |
        cd openwrt_builder
        sudo ./make -d -b "s905" -k "6.1.y" -a "y"

    - name: Upload Generated Images
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-amlogic-s905-img
        path: openwrt_builder/out/*.img
        if-no-files-found: ignore

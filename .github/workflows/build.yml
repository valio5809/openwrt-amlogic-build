name: Build OpenWrt for Amlogic

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Initialize environment & dependencies
      run: |
        sudo apt update
        sudo apt install -y build-essential clang flex bison g++ gawk gcc-multilib g++-multilib \
          gettext git libncurses5-dev libssl-dev python3-distutils rsync unzip zlib1g-dev \
          file wget swig libelf-dev

    - name: Clone OpenWrt Source
      run: |
        git clone https://github.com/openwrt/openwrt.git openwrt
        cd openwrt
        ./scripts/feeds update -a
        ./scripts/feeds install -a

    - name: Configure custom options (Audio, ALSA & LuCI)
      run: |
        cd openwrt
        echo "CONFIG_TARGET_amlogic=y" >> .config
        echo "CONFIG_SOUND=y" >> .config
        echo "CONFIG_SND=y" >> .config
        echo "CONFIG_PACKAGE_kmod-sound-core=y" >> .config
        echo "CONFIG_PACKAGE_kmod-usb-audio=y" >> .config
        echo "CONFIG_PACKAGE_alsa-utils=y" >> .config
        
        # Добавяме уеб интерфейса LuCI и български превод
        echo "CONFIG_PACKAGE_luci=y" >> .config
        echo "CONFIG_PACKAGE_luci-ssl=y" >> .config
        echo "CONFIG_PACKAGE_luci-i18n-base-bg=y" >> .config
        
        make defconfig

    - name: Build OpenWrt
      run: |
        cd openwrt
        make -j$(nproc) || make -j1 V=s

    - name: Upload OpenWrt Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: openwrt-amlogic-rootfs
        path: openwrt/bin/targets/amlogic/*/*
